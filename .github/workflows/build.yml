name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pakketten installeren
        run: npm install --no-audit --no-fund

      - name: App klaarzetten
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/www.js
          npx cap add android
          node scripts/android.js
          npx cap sync android

      - name: APK bouwen
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "What went wrong|error:|ERROR:" -A3 build.log | head -40 | while IFS= read -r regel; do
              echo "::error::$regel"
            done
            exit 1
          }

      - name: APK klaarzetten als download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Huisritme.apk
          gh release create "build-${{ github.run_number }}" Huisritme.apk --title "Huisritme ${{ github.run_number }}" --notes "Download Huisritme.apk en installeer hem. Updates gaan over de vorige versie heen; je gegevens blijven staan."
