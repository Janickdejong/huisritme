<meta name="claude:viewport-fit-sides" content="cover">
<title>Huisritme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
@property --p{syntax:'<number>';inherits:false;initial-value:0}
/* Concept: een papieren dagagenda in drie dagdelen. Bovenaan één kaart met wat nu aan de beurt is,
   daaronder een doorlopende lijn met bolletjes per taak. Eigen schermen voor eten, was en thesis. */
:root{
  --bg:#ECF1F2; --surface:#FFFFFF; --sunk:#E1E9EB; --ink:#1B2A2E; --ink-2:#4B5F66; --line:#D2DDE0;
  --accent:#2D6A6F; --accent-ink:#FFFFFF; --accent-soft:#D6E8E9; --accent-deep:#1B4A4E;
  --now:#C4523A; --danger:#A63D2F; --scrim:rgba(16,32,36,.45);
  --thesis:#4F5BA3; --thesis-soft:#E1E4F4;
  --c-kinderen:#C98425; --c-was:#4678BC; --c-schoon:#3A9484; --c-koken:#C4523A; --c-lunch:#74923A; --c-boodschappen:#8760B5; --c-eigen:#6F8087; --c-thesis:#4F5BA3; --c-rust:#6B7FB0; --c-bewegen:#4F9A6A; --c-zorg:#B5728F;
  --shadow:0 1px 2px rgba(20,40,45,.06),0 10px 28px rgba(20,40,45,.09);
  --font-display:'Young Serif',Georgia,'Times New Roman',serif;
  --font-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101719; --surface:#182225; --sunk:#202D31; --ink:#E4EEF0; --ink-2:#97ADB3; --line:#2A3A3F;
    --accent:#74C2C6; --accent-ink:#0C1A1C; --accent-soft:#1F3A3D; --accent-deep:#A9E0E3;
    --now:#EE8C76; --danger:#F09080; --scrim:rgba(0,0,0,.6);
    --thesis:#A3ADEB; --thesis-soft:#262C4A;
    --c-kinderen:#E3A956; --c-was:#7FA9DE; --c-schoon:#6CC1B2; --c-koken:#E58A74; --c-lunch:#A9C26A; --c-boodschappen:#B995DD; --c-eigen:#8FA1A6; --c-thesis:#A3ADEB; --c-rust:#A3B2DE; --c-bewegen:#86C79C; --c-zorg:#DDA3BC;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101719; --surface:#182225; --sunk:#202D31; --ink:#E4EEF0; --ink-2:#97ADB3; --line:#2A3A3F;
  --accent:#74C2C6; --accent-ink:#0C1A1C; --accent-soft:#1F3A3D; --accent-deep:#A9E0E3;
  --now:#EE8C76; --danger:#F09080; --scrim:rgba(0,0,0,.6);
  --thesis:#A3ADEB; --thesis-soft:#262C4A;
  --c-kinderen:#E3A956; --c-was:#7FA9DE; --c-schoon:#6CC1B2; --c-koken:#E58A74; --c-lunch:#A9C26A; --c-boodschappen:#B995DD; --c-eigen:#8FA1A6; --c-thesis:#A3ADEB; --c-rust:#A3B2DE; --c-bewegen:#86C79C; --c-zorg:#DDA3BC;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

/* Kleurthema's: elk thema herdefinieert alleen de tokens, licht en donker */
body.pal-roos{--bg:#FBF4F1;--surface:#FFFFFF;--sunk:#F5E8E4;--ink:#3A2A2E;--ink-2:#7A6168;--line:#EEDDD8;--accent:#B0607A;--accent-ink:#FFFFFF;--accent-soft:#F7E1E6;--accent-deep:#86405A;--now:#D9826B;--thesis:#7A68B0;--thesis-soft:#EEE8F7;--glow:#F9DCE0;--glow-2:#FBE8D6}
body.pal-salie{--bg:#F4F5EF;--surface:#FFFFFF;--sunk:#E8ECE0;--ink:#26302A;--ink-2:#5E6B60;--line:#DAE0D0;--accent:#5F8466;--accent-ink:#FFFFFF;--accent-soft:#DFEADB;--accent-deep:#3F6046;--now:#CC8457;--thesis:#7468A8;--thesis-soft:#E9E6F3;--glow:#DDEBD6;--glow-2:#F3E9D2}
body.pal-lavendel{--bg:#F7F4FA;--surface:#FFFFFF;--sunk:#EDE7F5;--ink:#2E2838;--ink-2:#6C6380;--line:#E1D9EE;--accent:#8268B4;--accent-ink:#FFFFFF;--accent-soft:#ECE4F8;--accent-deep:#5B4590;--now:#D3807F;--thesis:#B0607A;--thesis-soft:#F7E1E6;--glow:#E8DEF7;--glow-2:#F8E0E6}
body.pal-zee{--glow:#D6E8E9;--glow-2:#E1E4F4}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body.pal-roos{--bg:#1E1719;--surface:#2A2023;--sunk:#33282B;--ink:#F5E9EC;--ink-2:#C2A9B0;--line:#45363A;--accent:#E7A3B4;--accent-ink:#2A1A1F;--accent-soft:#4A2F37;--accent-deep:#F6CBD6;--now:#F0A58F;--thesis:#B9ACE6;--thesis-soft:#2F2A42;--glow:#3A262C;--glow-2:#36291F}
  :root:not([data-theme="light"]) body.pal-salie{--bg:#161B17;--surface:#1F2620;--sunk:#283028;--ink:#E8EFE6;--ink-2:#A9B8A8;--line:#354036;--accent:#A7C6A8;--accent-ink:#142016;--accent-soft:#2C3B2D;--accent-deep:#CFE3CF;--now:#E8A57C;--thesis:#B3AADF;--thesis-soft:#2A2840;--glow:#233223;--glow-2:#30291C}
  :root:not([data-theme="light"]) body.pal-lavendel{--bg:#1A1720;--surface:#24202C;--sunk:#2D2836;--ink:#EFEAF7;--ink-2:#B7AECB;--line:#3C3548;--accent:#C2B0E8;--accent-ink:#1C1726;--accent-soft:#372E4A;--accent-deep:#DED2F6;--now:#EFA3A3;--thesis:#E7A3B4;--thesis-soft:#4A2F37;--glow:#2E2640;--glow-2:#3A2630}
  :root:not([data-theme="light"]) body.pal-zee{--glow:#1F3A3D;--glow-2:#262C4A}
}
:root[data-theme="dark"] body.pal-roos{--bg:#1E1719;--surface:#2A2023;--sunk:#33282B;--ink:#F5E9EC;--ink-2:#C2A9B0;--line:#45363A;--accent:#E7A3B4;--accent-ink:#2A1A1F;--accent-soft:#4A2F37;--accent-deep:#F6CBD6;--now:#F0A58F;--thesis:#B9ACE6;--thesis-soft:#2F2A42;--glow:#3A262C;--glow-2:#36291F}
:root[data-theme="dark"] body.pal-salie{--bg:#161B17;--surface:#1F2620;--sunk:#283028;--ink:#E8EFE6;--ink-2:#A9B8A8;--line:#354036;--accent:#A7C6A8;--accent-ink:#142016;--accent-soft:#2C3B2D;--accent-deep:#CFE3CF;--now:#E8A57C;--thesis:#B3AADF;--thesis-soft:#2A2840;--glow:#233223;--glow-2:#30291C}
:root[data-theme="dark"] body.pal-lavendel{--bg:#1A1720;--surface:#24202C;--sunk:#2D2836;--ink:#EFEAF7;--ink-2:#B7AECB;--line:#3C3548;--accent:#C2B0E8;--accent-ink:#1C1726;--accent-soft:#372E4A;--accent-deep:#DED2F6;--now:#EFA3A3;--thesis:#E7A3B4;--thesis-soft:#4A2F37;--glow:#2E2640;--glow-2:#3A2630}
:root[data-theme="dark"] body.pal-zee{--glow:#1F3A3D;--glow-2:#262C4A}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-block:18px 116px;
  background-image:radial-gradient(90% 320px at 85% -40px,var(--glow,transparent),transparent 70%);background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul,ol{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}

.app{max-width:520px;margin:0 auto}
/* Begroeting met zachte kleurwolk en dagdeel-tekening */
.hero{position:relative;border-radius:26px;padding:22px 20px 18px;margin:0 -4px;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,var(--glow,var(--accent-soft)) 0%,transparent 55%),radial-gradient(90% 120% at 0% 100%,var(--glow-2,var(--thesis-soft)) 0%,transparent 60%),var(--surface);
  border:1px solid var(--line)}
.hero h1{position:relative;z-index:1}
.hero .lede{position:relative;z-index:1}
.hero .ctl{position:relative;z-index:1}
.hero-art{position:absolute;right:14px;top:14px;width:72px;height:72px;color:var(--accent);opacity:.9}
.hero .seg{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(4px)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px 6px 6px;min-height:44px;font:600 14px var(--font-body)}
.sw-btn.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sw-dots{display:flex}
.sw-dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px}
.sw-dots i:first-child{margin-left:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{font:400 15px var(--font-display);letter-spacing:.02em;color:var(--accent)}
.top .right{display:flex;align-items:center;gap:2px;min-width:0}
.date{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font:400 30px/1.1 var(--font-display);letter-spacing:-.015em;text-wrap:balance}
.lede{margin-top:4px;color:var(--ink-2)}
.label{display:inline-flex;align-items:center;gap:8px;font:700 12px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.iconbtn{width:44px;height:44px;border:0;background:none;color:var(--ink-2);border-radius:12px;display:grid;place-items:center;flex:none}
.top .iconbtn{margin-right:-10px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px;font:600 14px var(--font-body);text-align:left}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips.small .chip{min-height:36px;padding:6px 12px;font-size:13px}
.chips.days .chip{min-width:44px;text-align:center}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;min-height:38px;font:600 14px var(--font-body);color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.wide{display:grid;grid-template-columns:1fr 1fr;width:100%;margin-top:14px}
.ctl{margin-top:14px}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-2));flex:none}
.c-kinderen{--c:var(--c-kinderen)} .c-was{--c:var(--c-was)} .c-schoon{--c:var(--c-schoon)} .c-thesis{--c:var(--c-thesis)}
.c-koken{--c:var(--c-koken)} .c-lunch{--c:var(--c-lunch)} .c-boodschappen{--c:var(--c-boodschappen)} .c-eigen{--c:var(--c-eigen)} .c-rust{--c:var(--c-rust)} .c-bewegen{--c:var(--c-bewegen)} .c-zorg{--c:var(--c-zorg)}
.pill{font:700 11px var(--font-body);letter-spacing:.03em;text-transform:none;background:var(--sunk);color:var(--ink-2);padding:2px 9px;border-radius:999px}

/* Nu-kaart */
.focus{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px 20px 14px;box-shadow:var(--shadow);margin-top:16px;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.when{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.when b{font:400 22px var(--font-display);color:var(--accent)}
.when span{font-size:14px;color:var(--ink-2);font-weight:600}
.focus .cat{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.focus h2{font:400 28px/1.12 var(--font-display);letter-spacing:-.01em;margin:6px 0 8px;text-wrap:balance;overflow-wrap:anywhere}
.focus.rest h2{font-size:24px}
.focus.thesis{background:var(--thesis-soft);border-color:transparent}
.focus.thesis .when b{color:var(--thesis)}
.focus.thesis .btn.primary{background:linear-gradient(90deg,var(--accent-deep) calc(var(--p,0) * 100%),var(--thesis) 0);color:var(--surface)}
.bar{height:6px;border-radius:3px;background:var(--surface);margin:14px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--thesis);border-radius:3px}
.hint{color:var(--ink-2)}
.hint b{color:var(--ink)}
.focus .hint{margin-bottom:4px}
.extra{margin-top:14px}
.btns{display:grid;grid-template-columns:3fr 2fr;gap:10px;margin-top:18px}
.btn{position:relative;min-height:54px;border-radius:16px;font:700 17px var(--font-body);border:1px solid transparent;padding:0 14px}
.btn.primary{background:linear-gradient(90deg,var(--accent-deep) calc(var(--p,0) * 100%),var(--accent) 0);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.th{background:var(--thesis);color:var(--surface)}
.btn:disabled{opacity:.45}
.btn.sm{min-height:46px;font-size:15px}
.btn.wide{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.cardfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px}
.linkbtn.muted{color:var(--ink-2);font-weight:600}
.linkbtn.danger{color:var(--danger)}
.prog{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:12px;color:var(--ink-2);font-size:14px}
.pds{display:flex;flex-wrap:wrap;gap:5px}
.pd{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pd.on{background:var(--accent)}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:6px 8px 6px 14px;margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 10px;font-size:15px}
.banner.th{background:var(--thesis-soft)}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

/* Weekbalk */
.agendahead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:28px}
.agendahead h2{font:400 22px var(--font-display)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;border-radius:14px;padding:7px 0 6px;min-height:62px;color:var(--ink-2)}
.wd small{font:700 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase}
.wd b{font:400 19px/1.2 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd.today i{background:var(--now)}
.wd.on{background:var(--accent);color:var(--accent-ink)}
.wd.on b{color:var(--accent-ink)}
.wd.on.today i{background:var(--accent-ink)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:16px}
.dayhead h3{font:400 19px var(--font-display);text-wrap:balance}
.dayhead span{font-size:13px;color:var(--ink-2);flex:none}
.daymeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Tijdlijn */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:24px;margin-top:12px;padding:2px 0 8px;overflow:hidden}
.part{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:14px 16px 6px 22px}
.part::before,.ev::before,.free::before{content:"";position:absolute;left:29px;top:0;bottom:0;width:2px;background:var(--line)}
.tl>.part:first-child::before{top:20px}
.pm{position:relative;z-index:1;width:16px;height:16px;border-radius:5px;background:var(--surface);border:2px solid var(--ink-2);flex:none}
.part h3{font:400 18px var(--font-display);color:var(--ink)}
.part em{font-style:normal;font-size:13px;color:var(--ink-2)}
.part.now .pm{background:var(--now);border-color:var(--now)}
.nowtag{font:700 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--surface);background:var(--now);padding:2px 8px;border-radius:999px}
.free{position:relative;padding:6px 16px 10px 56px;font-size:14px;color:var(--ink-2)}
.ev{position:relative;display:grid;grid-template-columns:1fr auto;align-items:stretch;min-height:58px;padding-right:4px;background:linear-gradient(90deg,var(--accent-soft) calc(var(--p,0) * 100%),transparent 0)}
.ev .main{position:relative;min-width:0;display:flex;align-items:flex-start;gap:14px;text-align:left;background:none;border:0;padding:9px 0 10px 15px;min-height:56px;color:var(--ink)}
.node{position:relative;z-index:1;width:28px;height:28px;margin-top:1px;border-radius:50%;border:2.5px solid var(--c,var(--ink-2));background:var(--surface);background:color-mix(in srgb,var(--c,var(--ink-2)) 16%,var(--surface));display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.node svg{opacity:0}
.rt{min-width:0;padding-top:2px}
.txt{display:block;font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.sub{display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;font-size:13px;color:var(--ink-2);margin-top:2px}
.tpill{font:700 12px var(--font-body);font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px}
.ev.done .node{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.ev.done .node svg{opacity:1}
.ev.done .txt{color:var(--ink-2);text-decoration:line-through;font-weight:600}
.ev.skipped .node{border-style:dashed}
.ev.skipped .txt{color:var(--ink-2);font-weight:600}
.ev.waiting .node{border-style:dotted}
.ev.future .node{border-width:2px}
.ev .iconbtn{align-self:center}

/* Kaarten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:16px}
.card .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:10px}
.card h3{font:400 19px var(--font-display)}
.small-note{font-size:13px;color:var(--ink-2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.step{font-size:12px;font-weight:700;text-align:center;padding:9px 2px;border-radius:10px;background:var(--sunk);color:var(--ink-2)}
.step.past{background:var(--accent-soft);color:var(--accent)}
.step.now{background:var(--accent);color:var(--accent-ink)}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rowbtns .btn{flex:1 1 auto}
.card .hint{font-size:15px}
.inbox li{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.inbox li:first-child{border-top:0}
.inbox li span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.fblock{display:grid;gap:8px;margin-top:14px}
.fblock:first-of-type{margin-top:0}

/* Lijsten */
.sec{margin-top:24px}
.sec>h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:400 19px var(--font-display);margin-bottom:8px}
.sec>h3 span{font:600 13px var(--font-body);color:var(--ink-2)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:2px;padding:2px 4px 2px 14px;min-height:52px;border-top:1px solid var(--line);background:linear-gradient(90deg,var(--accent-soft) calc(var(--p,0) * 100%),transparent 0)}
.list>.row:first-child,.aisle .row{border-top:0}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left;background:none;border:0;padding:8px 0;min-height:48px;color:var(--ink)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.check svg{opacity:0}
.row.done .check{background:var(--accent);border-color:var(--accent)}
.row.done .check svg{opacity:1}
.row.done .txt{color:var(--ink-2);text-decoration:line-through;font-weight:600}
.row .txt{font-weight:600}
.dayrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 8px 10px 14px;min-height:62px;color:var(--ink)}
.list>.dayrow:first-child,.list>.recrow:first-child,.list>.aisle:first-child{border-top:0}
.dn{width:74px;flex:none}
.dn b{display:block;font:400 15px/1.2 var(--font-display)}
.dn small{font-size:12px;color:var(--ink-2)}
.dayrow.today .dn b{color:var(--accent)}
.dish{flex:1;min-width:0}
.dish b{display:block;font-weight:600;overflow-wrap:anywhere}
.dish b.none{color:var(--ink-2);font-weight:400}
.dish small{display:block;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.chev{flex:none;color:var(--ink-2)}
.recrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 8px 10px 14px;min-height:56px;color:var(--ink)}
.recrow .dish small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aisle{border-top:1px solid var(--line)}
.aisle h4{margin:0;padding:12px 14px 2px;font:700 12px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow .field{flex:1;min-width:0}
.addrow .btn{flex:none}
.shopacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.empty{padding:22px 16px;text-align:center;color:var(--ink-2)}
.sectionbtn{margin-top:14px}

/* Was */
.machine{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.drum{width:56px;height:56px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--c-was)}
.drum.on{background:var(--c-was);color:var(--surface)}
.drum.on svg{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.machine h3{font:400 20px var(--font-display);overflow-wrap:anywhere}
.machine p{color:var(--ink-2);font-size:14px}
.state{font:700 11px var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--c-was);background:var(--sunk);padding:2px 8px;border-radius:999px}

/* Velden */
.field{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg);color:var(--ink);font:inherit}
textarea.field{min-height:110px;resize:vertical;line-height:1.45}
input[type="time"].field{max-width:160px;font-variant-numeric:tabular-nums;font-weight:700}
.field::placeholder{color:var(--ink-2);opacity:.8}
.fgroup{display:grid;gap:8px}
.flabel{font:700 13px var(--font-body);color:var(--ink-2)}
.fhelp{font-size:13px;color:var(--ink-2)}
.err{color:var(--danger);font-size:14px;font-weight:600}
.switchrow{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.switchrow span{display:grid;gap:2px}
.switchrow b{font-weight:600}
input.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
input.sw:checked{background:var(--accent)}
input.sw:checked::after{transform:translateX(20px)}
.rotgrid{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center}
.rotgrid span{font-weight:700;color:var(--ink-2)}

/* Paneel */
#sheet{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding-top:8px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:slide .24s ease-out}
.panel:focus{outline:none}
.panel-in{max-width:520px;margin:0 auto;display:grid;gap:18px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 0}
.panel h2{font:400 24px/1.15 var(--font-display);text-wrap:balance}
.sheetbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheetbtns.one{grid-template-columns:1fr}
.stack{display:grid;gap:10px}
.note{background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink-2)}
@keyframes slide{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Ingedrukt houden */
[data-hold]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.btn.primary,.ev,.row{transition:--p .25s ease-out}
.holding{transition:none!important}
.bl,.bs{display:block;pointer-events:none}
.bl{line-height:1.25}
.bs{font:600 12px/1.2 var(--font-body);opacity:.85;margin-top:1px}
.btn.popped{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.03)}100%{transform:scale(1)}}
.ev.popped .node{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.ev.popped .node svg,.row.popped .check svg{opacity:1}
.row.popped .check{background:var(--accent);border-color:var(--accent)}
.ev.popped .txt,.row.popped .txt{color:var(--ink-2);text-decoration:line-through}
.p{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;pointer-events:none;z-index:2}
.btn .p{background:var(--accent-ink)}
.ev .p,.row .p{background:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;width:max-content;max-width:calc(100% - 32px);
  display:flex;align-items:center;gap:6px 12px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1;pointer-events:auto}
.toast.plain{padding:10px 16px}
.toast button{background:none;border:0;color:var(--bg);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:36px;padding:0 8px;white-space:nowrap}

/* Tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:14px;padding:4px 0;min-height:56px;color:var(--ink-2);font:600 12px var(--font-body);min-width:0}
.tab .ic{position:relative;display:grid;place-items:center;width:52px;height:30px;border-radius:999px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ic{background:var(--accent-soft)}
.badge{position:absolute;top:-3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 11px/18px var(--font-body);font-variant-numeric:tabular-nums}
.badge.live{background:var(--thesis);color:var(--surface);min-width:10px;width:10px;height:10px;padding:0;top:0;right:10px}

/* Ademruimte: ruimere maten, rustigere onderdelen */
body{padding-block:24px 132px}
.top{margin-bottom:18px}
.hero{padding:26px 22px 24px}
.eyebrow{position:relative;z-index:1;display:block;font:700 12px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.focus{padding:24px 22px 16px;margin-top:22px}
.focus h2{margin:10px 0 10px}
.focus .hint{margin-bottom:2px}
.btns{margin-top:22px}
.softline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 10px;margin-top:14px;padding:0 4px;font-size:14px;color:var(--ink-2)}
.agendahead{margin-top:44px}
.week{margin-top:14px}
.dayhead{margin-top:22px}
.daymeta{display:block;margin-top:4px;font-size:14px;color:var(--ink-2)}
.tl{margin-top:16px;padding:6px 0 14px}
.part{padding:20px 16px 8px 22px}
button.part{width:100%;background:none;border:0;text-align:left;color:var(--ink);cursor:pointer}
.part .sum{margin-left:auto;font-size:13px;color:var(--ink-2)}
.part .chev{transition:transform .15s}
.part[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ev{min-height:64px}
.ev .main{padding:14px 8px 14px 15px;min-height:62px}
.ev .sub:empty{display:none}
.free{padding:8px 16px 12px 56px}
.card{padding:22px;margin-top:24px}
.sec{margin-top:34px}
.sec>h3{margin-bottom:12px}
.twobtn{margin-top:26px}
.row{min-height:58px}
.sr-edit{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr-edit:focus{position:static;width:auto;height:auto;clip:auto;align-self:center;background:var(--accent-soft);color:var(--accent);border:0;border-radius:12px;padding:8px 12px;margin-right:8px;font-weight:700}
details.more{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:22px}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px;min-height:56px;font:400 18px var(--font-display);color:var(--ink)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary span{font:600 13px var(--font-body);color:var(--ink-2)}
details.more>summary .chev{transition:transform .15s}
details.more[open]>summary .chev{transform:rotate(90deg)}
details.more>.inner{padding:0 22px 22px}
details.more .list{border-radius:16px}

/* Afspraken en maand */
.evm{position:relative;z-index:1;width:28px;height:28px;margin-top:1px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.evt .txt{font-weight:800}
.allday{position:relative;display:flex;align-items:center;gap:10px;padding:16px 16px 4px 22px;font:400 16px var(--font-display);color:var(--ink-2)}
.allday::before{content:"";position:absolute;left:29px;top:0;bottom:0;width:2px;background:var(--line)}
.weeknav{display:flex;align-items:center;gap:2px}
.weekmonth{font-size:14px;color:var(--ink-2);margin-top:6px}
.apps li{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.apps li:first-child{border-top:0;padding-top:0}
.apps b{font:700 13px var(--font-body);color:var(--accent)}
.apps button{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--ink);min-height:28px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .wh{text-align:center;font:700 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:4px 0}
.md{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:46px;border:0;border-radius:12px;background:none;color:var(--ink);font:600 15px var(--font-body);font-variant-numeric:tabular-nums}
.md.out{color:var(--ink-2);opacity:.45}
.md:disabled{opacity:.35;cursor:default}
.md.today{box-shadow:inset 0 0 0 2px var(--now)}
.md.sel{background:var(--accent);color:var(--accent-ink)}
.md i{width:6px;height:6px;border-radius:50%;background:transparent}
.md i.e{background:var(--accent)}
.md.sel i.e{background:var(--accent-ink)}
.monthhead{display:flex;align-items:center;justify-content:space-between}

/* Dagdeel als kop links, taken iets ingesprongen eronder */
.tl .pm{display:none}
.part,.allday{padding-left:22px}
.part::before,.allday::before{display:none}
.part.now h3{color:var(--accent)}
.ev::before,.free::before{left:51px}
.ev .main{padding-left:37px}
.free{padding-left:80px}
.tl>.part:first-child{padding-top:18px}

/* Taken als compacte kaartjes */
.tl{background:none;border:0;border-radius:0;padding:0;margin-top:8px;overflow:visible}
.tl .part,.tl .allday{padding:20px 4px 10px}
.tl>.part:first-child,.tl>.allday:first-child{padding-top:12px}
.tl .part h3,.tl .allday{font-size:17px}
.tl .allday{color:var(--ink)}
.ev::before,.free::before{display:none}
.ev{display:flex;align-items:stretch;min-height:0;margin:0 0 8px;padding:0;border:1px solid var(--line);border-radius:14px;background:linear-gradient(90deg,var(--accent-soft) calc(var(--p,0) * 100%),var(--surface) 0);box-shadow:0 1px 2px rgba(20,40,45,.04)}
.ev .main{flex:1;align-items:center;gap:12px;padding:12px 14px;min-height:52px}
.node{width:22px;height:22px;margin-top:0;border-radius:7px;border-width:2px}
.node svg{width:12px;height:12px}
.ev .txt{font-size:15px;font-weight:600;line-height:1.3}
.ev .sub{font-size:12px;margin-top:3px}
.ev .tpill{font-size:11px;padding:1px 7px}
.ev.done{opacity:.6;box-shadow:none}
.ev.evt{background:linear-gradient(90deg,var(--accent-soft) calc(var(--p,0) * 100%),var(--accent-soft) 0);border-color:transparent}
.evt .txt{font-weight:700}
.evm{width:22px;height:22px;margin-top:0;border-radius:7px}
.evm svg{width:13px;height:13px}
.free{padding:2px 4px 8px;font-size:14px}
.tl button.part{padding-left:4px;padding-right:4px}

/* Tegels: twee kolommen per dagdeel */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .ev{margin:0;min-height:108px;border-radius:18px;border:0;box-shadow:none;
  background:linear-gradient(0deg,color-mix(in srgb,var(--c,var(--accent)) 30%,var(--surface)) calc(var(--p,0) * 100%),color-mix(in srgb,var(--c,var(--accent)) 13%,var(--surface)) 0)}
.grid .ev .main{position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;gap:10px;padding:14px 14px 12px;min-height:108px;height:100%}
.grid .ev .rt{padding:0;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.tcat{display:flex;align-items:center;gap:6px;font:800 10.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c,var(--ink-2)) 75%,var(--ink))}
.tcat i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-2))}
.grid .ev .txt{font-size:15px;font-weight:700;line-height:1.28}
.grid .ev .sub{margin-top:0}
.grid .node{align-self:flex-end;width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c,var(--ink-2)) 70%,var(--surface));background:var(--surface)}
.grid .ev.done .node{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.grid .ev.done{opacity:.55}
.grid .ev.skipped .node{border-style:dashed}
.grid .ev.evt{background:var(--accent);--c:var(--accent)}
.grid .ev.evt .txt,.grid .ev.evt .tcat{color:var(--accent-ink)}
.grid .ev.evt .tcat i{background:var(--accent-ink)}
.grid .ev.evt .tpill{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);color:var(--accent-ink)}
.grid .ev.evt .sub span{color:var(--accent-ink)}
.grid .evm{align-self:flex-end;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);color:var(--accent-ink);width:26px;height:26px;border-radius:9px}
.grid>.ev:last-child:nth-child(odd){grid-column:1/-1;min-height:84px}
.grid>.ev:last-child:nth-child(odd) .main{min-height:84px}
.grid .free{grid-column:1/-1}
.grid .sr-edit:focus{position:absolute;right:8px;top:8px}

/* Algemene tegel voor Eten, Was en Thesis */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;border-radius:18px;min-height:104px;color:var(--ink);
  background:linear-gradient(0deg,color-mix(in srgb,var(--c,var(--accent)) 30%,var(--surface)) calc(var(--p,0) * 100%),color-mix(in srgb,var(--c,var(--accent)) 13%,var(--surface)) 0);transition:--p .25s ease-out}
.tile.holding{transition:none}
button.tile,.tile>.tmain{border:0;text-align:left;font:inherit;color:inherit;background:none;cursor:pointer}
button.tile{background:linear-gradient(0deg,color-mix(in srgb,var(--c,var(--accent)) 30%,var(--surface)) calc(var(--p,0) * 100%),color-mix(in srgb,var(--c,var(--accent)) 13%,var(--surface)) 0)}
button.tile,.tile>.tmain{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:14px 14px 12px;min-height:104px;flex:1;width:100%}
.tile .ttl{display:block;font-size:15px;font-weight:700;line-height:1.28;overflow-wrap:anywhere}
.tile .tsub{display:block;font-size:12px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.tile .tfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tile .node{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c,var(--ink-2)) 70%,var(--surface));background:var(--surface);margin:0}
.tile.done{opacity:.55}
.tile.done .node,.tile.popped .node{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.tile.done .node svg,.tile.popped .node svg{opacity:1}
.tile.done .ttl{text-decoration:line-through}
.tile.wide{grid-column:1/-1}
.tile.emptyday{background:transparent;border:1.5px dashed var(--line)}
.tile.emptyday .ttl{color:var(--ink-2);font-weight:600}
.tile.today{min-height:120px}
.tile.today .ttl{font:400 21px/1.2 var(--font-display)}
.tile .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--ink-2);display:grid;place-items:center;z-index:2}
.tile .tlink{border:0;background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink);border-radius:999px;font:700 12px var(--font-body);padding:6px 10px;min-height:32px;cursor:pointer}
.tile.wait{opacity:.7}
.tiles>.tile:last-child:nth-child(odd):not(.wide){grid-column:1/-1;min-height:84px}
.tile .p{background:var(--c,var(--accent))}
.c-recept{--c:var(--c-koken)}
.tiles.pairs>.tile:last-child:not(.wide){grid-column:auto;min-height:104px}

/* Strakke langwerpige kaartjes: één kolom, kleurstreep links */
.grid,.tiles,.tiles.pairs{grid-template-columns:1fr;gap:6px}
.grid .ev,.tile{min-height:0;border-radius:12px;box-shadow:inset 4px 0 0 var(--c,var(--accent))}
.grid .ev{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--accent)) 26%,var(--surface)) calc(var(--p,0) * 100%),color-mix(in srgb,var(--c,var(--accent)) 9%,var(--surface)) 0)}
button.tile{background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--accent)) 26%,var(--surface)) calc(var(--p,0) * 100%),color-mix(in srgb,var(--c,var(--accent)) 9%,var(--surface)) 0)}
.tile{background:color-mix(in srgb,var(--c,var(--accent)) 9%,var(--surface))}
.grid .ev .main{flex-direction:row;align-items:center;gap:12px;padding:10px 12px 10px 16px;min-height:58px}
.grid .ev .rt{flex:1;min-width:0;gap:3px}
.tcat .dur{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font:600 12px var(--font-body);letter-spacing:0;text-transform:none;color:var(--ink-2);font-variant-numeric:tabular-nums}
.grid .ev.evt .tcat .dur{color:var(--accent-ink)}
.tcat .cents{display:inline-flex;align-items:center;gap:3px;font:700 12px var(--font-body);letter-spacing:0;text-transform:none;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-left:8px}
.tcat .dur+.cents{margin-left:8px}
.tcat i+.cents{margin-left:auto}
.tcat .cents svg{width:12px;height:12px}
.tcat .cents.off{opacity:.45;text-decoration:line-through}
.daymeter{margin:14px 0 6px;padding:12px 14px 16px;border-radius:14px;background:color-mix(in srgb,var(--water) 10%,var(--surface))}
.dmtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.dmtop b{color:var(--ink);font-weight:700}

function pad(n){return String(n).padStart(2,'0');}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function kdate(k){var p=String(k).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}

function diffDays(a,b){return Math.round((kdate(b)-kdate(a))/864e5);}

function toMin(hm){var p=String(hm||'0:00').split(':');return (+p[0]||0)*60+(+p[1]||0);}
function fromMin(m){m=Math.max(0,Math.min(1439,Math.round(m)));return pad(Math.floor(m/60))+':'+pad(m%60);}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function tsTime(ts){var d=new Date(ts);if(dkey(d)!==today())return dkey(d)>today()?'23:59':'00:00';return fromMin(d.getHours()*60+d.getMinutes());}

function normalize(s){
  if(!s||typeof s!=='object'||s.v!==2||!Array.isArray(s.tasks))return null;
  var d=defaults(),needMig=s.layout!=='parts';
  s.tasks=s.tasks.filter(function(t){return t&&typeof t==='object'&&t.id;});
  s.tasks.forEach(function(t){
    if(needMig){
      t.part=t.part||(t.anchor?ANCHOR_TO_PART[t.anchor]:(t.time?partOfMin(toMin(t.time)):'ochtend'))||'ochtend';
      delete t.time;
    }
    if(PIDS.indexOf(t.part)<0)t.part='ochtend';
    delete t.anchor;
    if(!t.cat)t.cat='eigen';
    if(typeof t.text!=='string')t.text=String(t.text||'');
    if(t.time&&!/^\d{1,2}:\d{2}$/.test(t.time))delete t.time;
  });
  if(s.settings&&typeof s.settings==='object'){
    if(!s.settings.washPart)s.settings.washPart=s.settings.washTime?partOfMin(toMin(s.settings.washTime)):'ochtend';
    delete s.settings.washTime;
  }
  /* oude enkele was omzetten naar wassen */
  if(!Array.isArray(s.loads)){
    s.loads=[];
    if(s.wash&&typeof s.wash==='object'&&s.wash.step!==null&&s.wash.step!==undefined){
      s.loads.push({id:'w1',name:'Was',step:+s.wash.step||0,endsAt:s.wash.endsAt||null,stepAt:s.wash.stepAt||null});
    }
  }
  if(s.wash&&typeof s.wash==='object')s.wash={lastStart:s.wash.lastStart||null};
  s.layout='parts';
  if(ME&&s.ritme!==2){s.tasks=ritmeJanick().concat(s.tasks.filter(function(t){return !/^j\d+$/.test(t.id);}));s.ritme=2;}
  Object.keys(d).forEach(function(k){if(s[k]===undefined||s[k]===null&&k!=='defaultLunch')s[k]=d[k];});
  ['menu','energy','settings','shop','wash','thesis','log','clean','roomPlan','jar'].forEach(function(k){if(typeof s[k]!=='object'||Array.isArray(s[k]))s[k]=d[k];});
  (function(){var dj=d.jar,j=s.jar;Object.keys(dj).forEach(function(k){if(typeof j[k]!==typeof dj[k])j[k]=dj[k];});if(j.v!==5){j.pts=0;j.size=12;j.rounds=0;j.v=5;}j.pts=Math.max(0,Math.round(j.pts));if([9,12,16].indexOf(j.size)<0)j.size=12;if(!j.started)j.started=dkey();})();
  ['settings','shop','wash','thesis'].forEach(function(k){Object.keys(d[k]).forEach(function(j){if(s[k][j]===undefined)s[k][j]=d[k][j];});});
  ['covered','coveredL','boughtAt','got'].forEach(function(k){if(typeof s.shop[k]!=='object'||!s.shop[k])s.shop[k]={};});
  ['recipes','lunches','staples','inbox','rotation','loads','events'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=d[k];});
  s.events=s.events.filter(function(e){return e&&e.id&&/^\d{4}-\d{2}-\d{2}$/.test(e.date||'');});
  if(!Array.isArray(s.shop.manual))s.shop.manual=[];
  if(!Array.isArray(s.settings.washDays))s.settings.washDays=d.settings.washDays;
  if(!Array.isArray(s.thesis.steps))s.thesis.steps=[];
  if(!Array.isArray(s.thesis.days))s.thesis.days=[];
  if(PIDS.indexOf(s.thesis.part)<0)s.thesis.part='ochtend';
  s.loads=s.loads.filter(function(l){return l&&l.id&&l.step>=0&&l.step<WASH.length;});
  /* bestaande taken die gelijk zijn aan een kant-en-klare taak herkennen, zodat niets dubbel komt */
  var byText={};LIBRARY.forEach(function(g){g.items.forEach(function(i){if(!byText[norm(i.text)])byText[norm(i.text)]=i.key;});});
  var alias={'tassen en gymspullen klaarzetten':'tassen','aanrecht even afnemen':'aanrecht'};
  s.tasks.forEach(function(t){if(!t.libKey&&!t.kind&&!t.date){var k=byText[norm(t.text)]||alias[norm(t.text)];if(k&&!s.tasks.some(function(x){return x.libKey===k;}))t.libKey=k;}});
  Object.keys(s.log).forEach(function(k){
    var l=s.log[k];if(!l||typeof l!=='object')l={};
    if(!l.done||typeof l.done!=='object')l.done={};
    if(!l.skip||typeof l.skip!=='object')l.skip={};

function flush(){
  if(!remote.ref||remote.writing||!remote.dirty)return;
  remote.writing=true;remote.dirty=false;
  remote.ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).then(function(){remote.status='synced';},function(e){
    var c=e&&e.code;
    if(c==='unavailable'||c==='resource_exhausted')remote.dirty=true;
    else{remote.ref=null;remote.status='local';}
  }).then(function(){
    remote.writing=false;
    if(remote.dirty&&remote.ref){clearTimeout(remote.timer);remote.timer=setTimeout(flush,2000);}
  });
}
function adoptRemote(d){
  try{
    var n=normalize(JSON.parse(d.json));
    if(!n)return;
    S=n;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}

function connect(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return;
      var ref;
      try{ref=db.doc('data/users/'+id+'/'+(ME?'huisritme-janick':'huisritme'));}catch(e){return;}
      remote.ref=ref;remote.status='pending';
      ref.onSnapshot(function(snap){
        if(snap.metadata&&snap.metadata.hasPendingWrites)return;
        if(!snap.exists){
          if(S.setupDone){remote.dirty=true;flush();}
          else remote.status='synced';
          return;
        }
        var d=snap.data()||{};
        remote.status='synced';
        if((d.updatedAt||0)>(S.updatedAt||0)&&!remote.dirty&&!remote.writing)adoptRemote(d);
        else if((d.updatedAt||0)<(S.updatedAt||0)&&S.setupDone&&!remote.writing){remote.dirty=true;flush();}
      },function(){remote.ref=null;remote.status='local';});
    });
  }).catch(function(){});
}

function rollDay(){

  Object.keys(S.menu).forEach(function(k){if(diffDays(k,t)>14)delete S.menu[k];});

  ['covered','coveredL'].forEach(function(c){Object.keys(S.shop[c]).forEach(function(k){if(k<t)delete S.shop[c][k];});});

  S.events=S.events.filter(function(e){return (e.repeat&&e.repeat!=='none')||diffDays(e.date,t)<=60;});

/* ================= boodschappen ================= */
function aisleOf(name){
  var n=norm(name),words=n.split(/[\s,\/-]+/),best='overig',bl=0;
  AISLES.forEach(function(a){a.kw.forEach(function(kw){
    if(kw.length>bl&&(n===kw||words.some(function(w){return w.indexOf(kw)===0;}))){best=a.id;bl=kw.length;}
  });});
  return best;
}
function shopItems(){
  var t=today(),map={},order=[],lunchIds=[];
  function add(name,src,manual){
    name=String(name||'').trim();if(!name)return;
    var k=norm(name),at=S.shop.boughtAt[k];
    if(!manual&&at&&diffDays(at,t)<4)return;
    if(!map[k]){map[k]={name:name,key:k,src:[],manual:false,aisle:aisleOf(name)};order.push(k);}
    if(src&&map[k].src.indexOf(src)<0)map[k].src.push(src);
    if(manual)map[k].manual=true;
  }
  for(var i=0;i<7;i++){
    var k=addDays(t,i),d=dinnerFor(k);
    if(d&&typeof d==='object'&&S.shop.covered[k]!==d.id)d.ing.forEach(function(n){add(n,d.name);});
    var lid=lunchIdFor(k);
    if(lid&&S.shop.coveredL[k]!==lid&&lunchIds.indexOf(lid)<0)lunchIds.push(lid);
  }
  lunchIds.forEach(function(id){var l=lunchRec(id);if(l)l.ing.forEach(function(n){add(n,'Lunch');});});
  S.staples.forEach(function(n){add(n,'Vaste boodschap');});
  S.shop.manual.forEach(function(n){add(n,'Zelf toegevoegd',true);});
  return order.map(function(k){var it=map[k];it.got=!!S.shop.got[k];return it;});
}
function shopLeft(){return shopItems().filter(function(i){return !i.got;}).length;}
function finishShopping(){
  var t=today(),got=function(n){return !!S.shop.got[norm(n)];};
  for(var i=0;i<7;i++){
    var k=addDays(t,i),d=dinnerFor(k),l=lunchFor(k);
    if(d&&typeof d==='object'&&d.ing.every(got))S.shop.covered[k]=d.id;
    if(l&&l.ing.every(got))S.shop.coveredL[k]=l.id;
  }
  Object.keys(S.shop.got).forEach(function(k){if(S.shop.got[k])S.shop.boughtAt[k]=t;});
  Object.keys(S.shop.boughtAt).forEach(function(k){if(diffDays(S.shop.boughtAt[k],t)>=4)delete S.shop.boughtAt[k];});
  S.shop.manual=S.shop.manual.filter(function(n){return !got(n);});
  S.shop.got={};
}
function listText(){
  var items=shopItems().filter(function(i){return !i.got;}),out=['Boodschappen'];
  AISLES.forEach(function(a){
    var g=items.filter(function(i){return i.aisle===a.id;});
    if(g.length){out.push('');out.push(a.name);g.forEach(function(i){out.push('- '+i.name);});}
  });
  return out.join('\n');
}

function inMachine(){return S.loads.filter(function(l){return l.step===1;})[0]||null;}

function loadItem(l){

function washItems(k){

function advanceLoad(l){

  l.step++;l.stepAt=Date.now();

var CAL=icon('<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',16);
function eventOn(e,k){
  if(e.date===k)return true;
  if(e.date>k)return false;
  if(e.repeat==='week')return wdOf(e.date)===wdOf(k);
  if(e.repeat==='year')return e.date.slice(5)===k.slice(5);
  return false;
}
function eventsOn(k){
  return S.events.filter(function(e){return eventOn(e,k);}).sort(function(a,b){
    if(!a.time&&b.time)return -1;if(a.time&&!b.time)return 1;
    return toMin(a.time||'0:00')-toMin(b.time||'0:00');
  });
}
function repeatLabel(r){return r==='week'?'elke week':r==='year'?'elk jaar':'';}
function evtRow(e){
  var sub=[];
  sub.push('<span class="tpill">'+(e.time?esc(e.time):'hele dag')+'</span>');
  if(e.remind&&e.remind!=='none')sub.push('<span class="tpill" aria-label="Melding '+esc(remindLabel(e.remind))+'">'+BELL+' '+esc(remindLabel(e.remind))+'</span>');
  if(e.repeat&&e.repeat!=='none')sub.push('<span>'+repeatLabel(e.repeat)+'</span>');
  return '<div class="ev evt"><button class="main" data-act="editevent" data-id="'+esc(e.id)+'" aria-label="Afspraak: '+esc(e.title)+(e.time?' om '+esc(e.time):', hele dag')+'. Tik om aan te passen">'+
    '<span class="rt"><span class="tcat"><i></i>Afspraak</span><span class="txt">'+esc(e.title)+'</span><span class="sub">'+sub.join('')+'</span></span><span class="evm">'+CAL+'</span></button></div>';
}
function upcoming(n){

var BELL=icon('<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',13);
var PART_START={ochtend:'08:00',middag:'13:00',avond:'18:00'};
var EVENT_REMIND=[['none','Geen'],['m15','15 min ervoor'],['h1','1 uur ervoor'],['morning','Die ochtend'],['eve','De avond ervoor']];
function tsOf(k,hm){var d=kdate(k),m=toMin(hm);d.setHours(Math.floor(m/60),m%60,0,0);return d.getTime();}
function occursOn(task,k){
  var w=wdOf(k);
  if(task.date)return task.date===k&&!task.doneOn;
  if(task.days&&task.days.length&&task.days.indexOf(w)<0)return false;
  if(task.kind==='shop')return w===S.settings.shopDay;
  if(task.kind==='rotation')return !!roomFor(k);
  return true;
}
function taskTitle(task,k){
  if(task.kind==='rotation'){var rr=roomFor(k);return rr?roomTaskText(rr):'Een kamer schoonmaken';}
  if(task.kind==='dinner'){var d=dinnerText(k);return d?'Avondeten: '+d:'Avondeten';}
  if(task.kind==='lunch'){var l=lunchFor(k);return l?'Lunch: '+l.name:'Lunch';}
  return task.text;
}
function eventRemindAt(e,k){
  var r=e.remind||'none',base=e.time||'09:00';
  if(r==='m15')return tsOf(k,base)-15*60000;
  if(r==='h1')return tsOf(k,base)-60*60000;
  if(r==='morning')return tsOf(k,'08:00');
  if(r==='eve')return tsOf(addDays(k,-1),'20:00');
  return null;
}
function remindLabel(r){var f=EVENT_REMIND.filter(function(x){return x[0]===r;})[0];return f?f[1].toLowerCase():'';}
function upcomingReminders(){
  var t=today(),now=Date.now(),out=[];
  for(var i=0;i<8;i++){
    var k=addDays(t,i);
    S.tasks.forEach(function(task){
      if(!task.remind||!occursOn(task,k))return;
      if(i===0&&!task.date&&LR(t).done[task.id])return;
      var at=tsOf(k,task.remind);
      if(at>now)out.push({key:'t:'+task.id+':'+k,at:at,title:taskTitle(task,k),body:P(task.part).when+(task.time?' om '+task.time:'')});
    });
  }
  for(var j=-1;j<15;j++){
    var k2=addDays(t,j);
    S.events.forEach(function(e){
      if(!e.remind||e.remind==='none'||!eventOn(e,k2))return;
      var at2=eventRemindAt(e,k2);
      if(at2&&at2>now)out.push({key:'e:'+e.id+':'+k2,at:at2,title:e.title,body:(k2===t?'Vandaag':k2===addDays(t,1)?'Morgen':cap(dayLong(k2)))+(e.time?' om '+e.time:'')});
    });
  }
  S.loads.forEach(function(l){if(l.step===1&&l.endsAt&&l.endsAt>now)out.push({key:'w:'+l.id+':'+l.endsAt,at:l.endsAt,title:'De wasmachine is klaar',body:'Tijd om '+((loadName(l)||'de was').toLowerCase())+' op te hangen.'});});
  var s=S.thesis.session;if(s&&s.endsAt>now)out.push({key:'th:'+s.endsAt,at:s.endsAt,title:'Je thesistijd is om',body:'Schrijf even op waar je gebleven bent.'});
  return out.sort(function(a,b){return a.at-b.at;}).slice(0,60);
}
/* Native meldingen in de Android-app (Capacitor + @capacitor/local-notifications) */
function nativeLN(){try{return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications||null;}catch(e){return null;}}
function hashId(str){var h=0;for(var i=0;i<str.length;i++){h=((h<<5)-h+str.charCodeAt(i))|0;}return Math.abs(h)%2000000000+1;}
var nativeTimer=0,nativeAsked=false;
function syncNative(){
  var LN=nativeLN();if(!LN)return;
  clearTimeout(nativeTimer);
  nativeTimer=setTimeout(function(){
    var list=upcomingReminders();
    var go=function(){
      LN.getPending().then(function(p){
        var ours=(p&&p.notifications||[]).filter(function(n){return n.extra&&n.extra.huisritme;}).map(function(n){return {id:n.id};});
        return ours.length?LN.cancel({notifications:ours}):null;
      }).catch(function(){}).then(function(){
        if(!list.length)return;
        return LN.schedule({notifications:list.map(function(r){return {id:hashId(r.key),title:r.title,body:r.body,schedule:{at:new Date(r.at),allowWhileIdle:true},extra:{huisritme:1,key:r.key}};})});
      }).catch(function(){});
    };
    if(!list.length){go();return;}
    if(nativeAsked){go();return;}
    nativeAsked=true;
    LN.checkPermissions().then(function(st){return st&&st.display==='granted'?st:LN.requestPermissions();}).then(go,go);
  },1200);
}
/* In de browser: melding als de app open is */
var FIRED_KEY=ME?'huisritme-gemeld-janick':'huisritme-gemeld';
function firedSet(){try{return JSON.parse(localStorage.getItem(FIRED_KEY))||{};}catch(e){return {};}}
function checkInApp(){
  if(nativeLN())return;
  var fired=firedSet(),now=Date.now(),changed=false;
  /* herinneringen die in de afgelopen 2 minuten vielen */
  var cand=[],t=today();
  S.tasks.forEach(function(task){if(task.remind&&occursOn(task,t)&&!(!task.date&&LR(t).done[task.id])){var at=tsOf(t,task.remind);cand.push({key:'t:'+task.id+':'+t,at:at,title:taskTitle(task,t)});}});
  [t,addDays(t,1)].forEach(function(k){S.events.forEach(function(e){if(e.remind&&e.remind!=='none'&&eventOn(e,k)){var at=eventRemindAt(e,k);if(at)cand.push({key:'e:'+e.id+':'+k,at:at,title:e.title+(e.time?' om '+e.time:'')});}});});
  cand.forEach(function(c){
    if(c.at<=now&&now-c.at<120000&&!fired[c.key]){fired[c.key]=now;changed=true;ensureAudio();plink();buzz();toast('Herinnering: '+c.title);}
  });
  if(changed){Object.keys(fired).forEach(function(k){if(now-fired[k]>3*864e5)delete fired[k];});try{localStorage.setItem(FIRED_KEY,JSON.stringify(fired));}catch(e){}}
}
function sessionLeft(){var s=S.thesis.session;return s?Math.max(0,Math.ceil((s.endsAt-Date.now())/60000)):0;}

/* ================= agenda van een dag ================= */
function itemsFor(k){
  var t=today(),isToday=k===t,w=wdOf(k),lg=isToday?LR(t):EMPTY_LOG,hv=isToday&&heavy(),out=[];
  S.tasks.forEach(function(task,ix){
    if(hv&&!task.basic)return;
    var it={id:task.id,taskId:task.id,text:task.text,hint:'',cat:task.cat||'eigen',min:task.min||0,part:task.part||'ochtend',time:task.time||null,ord:ix,kind:task.kind||'',oneoff:!!task.date,days:null};
    if(task.date){
      if(isToday){
        if(task.date>t)return;
        if(task.doneOn&&task.doneOn!==t)return;
        it.done=task.doneOn===t;
        if(task.date<t&&!it.done)it.carried=true;
      }else{
        if(task.date!==k||task.doneOn)return;
      }
    }else{
      if(task.days&&task.days.length&&task.days.indexOf(w)<0)return;
      if(task.days&&task.days.length<7)it.days=task.days;
      it.done=!!lg.done[task.id];
    }
    if(task.kind==='rotation'){
      var rid=roomFor(k);if(!rid)return;
      it.text=roomTaskText(rid);it.hint='Eén kamer vandaag. Lukt het niet, dan komt hij morgen terug.';it.days=null;it.roomId=rid;
      if(isToday&&S.clean[rid]===t)it.done=true;
    }else if(task.kind==='shop'){
      if(w!==S.settings.shopDay)return;
      if(isToday){var n=shopLeft();it.hint=n?'Je lijst staat klaar met '+n+(n===1?' ding.':' dingen.'):'Je lijst is nog leeg.';}
      it.action='shop';
    }else if(task.kind==='lunch'){
      var l=lunchFor(k);it.text=l?'Lunch: '+l.name:'Lunch maken';
    }else if(task.kind==='dinner'){
      var d=dinnerFor(k);
      if(d==='rest')it.text='Avondeten: restjes opwarmen';
      else if(d==='uit')it.text='Avondeten halen of uit eten';
      else if(d)it.text='Avondeten: '+d.name;
      else{it.text='Avondeten kiezen';it.hint='Er staat nog niets op het menu.';it.action='pick';}
    }
    if(isToday&&lg.moved[it.id]&&lg.moved[it.id]!==it.part){it.movedFrom=it.part;it.part=lg.moved[it.id];}
    it.skipped=!!lg.skip[it.id]&&!it.done;
    out.push(it);
  });
  var tm=addDays(k,1),dt=ME?null:dinnerFor(tm);
  if(dt&&typeof dt==='object'&&dt.prep){
    var pid='prep-'+tm;
    out.push({id:pid,text:'Voor morgen: '+dt.prep,hint:'Morgen eten jullie '+dt.name.toLowerCase()+'.',cat:'koken',part:(isToday&&lg.moved[pid])||'avond',time:null,ord:999,kind:'prep',min:5,done:!!lg.done[pid],skipped:!!lg.skip[pid]&&!lg.done[pid]});
  }
  if(!ME){var th=thesisItem(k);if(th)out.push(th);
  washItems(k).forEach(function(x){out.push(x);});}
  /* per dagdeel: eerst de thesis, dan vrije taken in hun eigen volgorde, daarna wat een vaste tijd heeft */
  out.sort(function(a,b){
    var d=pIdx(a.part)-pIdx(b.part);if(d)return d;
    var ka=a.time?10000+toMin(a.time):(a.ord||0),kb=b.time?10000+toMin(b.time):(b.ord||0);
    return ka-kb;
  });
  return out;
}
function queue(){
  var cp=pIdx(curPart());
  var open=itemsFor(today()).filter(function(i){return !i.done&&!i.skipped;});
  var now=open.filter(function(i){return pIdx(i.part)===cp&&!i.waiting;});
  var left=open.filter(function(i){return pIdx(i.part)<cp&&!i.waiting&&(i.oneoff||i.active);});
  var later=open.filter(function(i){return pIdx(i.part)>cp&&!i.waiting;});
  var wait=open.filter(function(i){return i.waiting;});
  left.forEach(function(i){i.leftover=true;});
  var nm=nowMin(),soon=[],notyet=[];
  now.forEach(function(i){(i.time&&toMin(i.time)-nm>45?notyet:soon).push(i);});
  return soon.concat(left,notyet,later,wait);
}

function drops(n){return n===1?'1 druppel':n+' druppels';}
function gCap(){return S.jar.size*PER;}
function blooming(){return Math.min(S.jar.size,Math.floor(S.jar.pts/PER));}
function gFull(){return S.jar.pts>=gCap();}
function earn(key,min,kind,n){
  lastEarn=null;var J=S.jar;if(!J.on)return;
  var lg=L();if(!lg.coins)lg.coins={};if(lg.coins[key])return;
  n=n||1;var b0=blooming(),f0=gFull();
  lg.coins[key]=n;J.pts+=n;
  lastEarn={amt:n,bloom:blooming()>b0,goal:!f0&&gFull()};
}
function unearn(key){var lg=L();if(lg.coins&&lg.coins[key]){S.jar.pts=Math.max(0,S.jar.pts-lg.coins[key]);delete lg.coins[key];}}
var TIERS=[['day50',0.5,1,'Halve dag rond'],['day75',0.75,1,'Driekwart rond'],['day100',1,1,'Hele dag rond']];
function dayProgress(){
  var its=itemsFor(today()).filter(function(i){return !i.skipped&&i.kind!=='wash'&&i.kind!=='event';});
  var d=its.filter(function(i){return i.done;}).length;
  return {done:d,total:its.length,pct:its.length?d/its.length:0};
}
function syncDayCoins(strict){
  if(!S.jar||!S.jar.on)return null;
  var pr=dayProgress(),lg=LR(),got=null,keep=lastEarn;
  TIERS.forEach(function(t){
    var has=!!(lg.coins&&lg.coins[t[0]]),ok=pr.total>=2&&pr.pct>=t[1]-1e-9;
    if(ok&&!has){earn(t[0],0,'',t[2]);if(lastEarn&&lastEarn.amt)got={amt:(got?got.amt:0)+lastEarn.amt,label:t[3],last:t[1]===1,bloom:(got&&got.bloom)||lastEarn.bloom,goal:(got&&got.goal)||lastEarn.goal};lg=LR();}
    else if(strict&&has&&!ok)unearn(t[0]);
  });
  lastEarn=keep;
  return got;
}
function tierEarned(){var c=LR().coins||{},n=0;TIERS.forEach(function(t){n+=c[t[0]]||0;});return n;}
function lastTended(){
  var ks=Object.keys(S.log).sort().reverse();
  for(var i=0;i<ks.length;i++){var c=S.log[ks[i]].coins;if(c&&c.day50)return ks[i];}

  var r0=roomToday();if(r0)clean[r0]=t;
  var n=diffDays(t,k),r=null;
  for(var d=1;d<=n;d++){var day=addDays(t,d);r=pickRoom(clean,day);if(r&&d<n)clean[r]=day;}
  return r;

function stonePath(th){
  var done=th.steps.filter(function(s){return s.done;}),open=th.steps.filter(function(s){return !s.done;});
  var all=done.concat(open).slice(-10),n=all.length;
  if(!n)return '';

  var d='M'+pts[0][0]+' '+pts[0][1];
  for(var i=1;i<pts.length;i++){var mx=(pts[i-1][0]+pts[i][0])/2;d+=' Q'+mx+' '+(pts[i-1][1]+(i%2?-14:14))+' '+pts[i][0]+' '+pts[i][1];}
  var last=pts[pts.length-1];d+=' Q'+(last[0]+16)+' '+(last[1]-10)+' 300 40';
  var nextKey=norm(th.next);
  var stones=all.map(function(s,i){var p=pts[i],isNext=!s.done&&nextKey&&norm(s.text)===nextKey;
    return (isNext?'<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="17" ry="12" stroke="var(--thesis)" stroke-width="2" stroke-dasharray="3 3"/>':'')+
      '<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="12" ry="8.5" fill="'+(s.done?'var(--thesis)':'var(--surface)')+'" stroke="'+(s.done?'var(--thesis)':'currentColor')+'" stroke-width="2"/>';}).join('');
  return '<div class="path"><svg viewBox="0 0 320 84" fill="none" role="img" aria-label="'+done.length+' van '+th.steps.length+' stappen gezet">'+
    '<path d="'+d+'" stroke="currentColor" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" opacity=".6"/>'+stones+
    '<path d="M300 40V12" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/><path d="M300 13l16 6-16 6z" fill="var(--thesis)"/></svg></div>'+

/* panel-acties */
function saveTask(){
  var sh=sheet,t=sh.id?findTask(sh.id):null,special=!!(t&&t.kind),obj=t||{id:uid()};
  if(!special){
    var text=fval('fText').trim();
    if(!text){showErr('fTextErr','Schrijf eerst op wat er moet gebeuren.');document.getElementById('fText').focus();return;}
    var rep=gv('rep')[0]||'once';
    if(rep==='days'){
      var ds=gv('days').map(Number);
      if(!ds.length){showErr('fDaysErr','Kies minstens één dag.');return;}
      obj.days=ds;obj.date=null;delete obj.doneOn;
    }else if(rep==='once'){
      var nd=fval('fDate')||today();
      if(obj.date!==nd)delete obj.doneOn;
      obj.date=nd;obj.days=null;
    }else{obj.days=null;obj.date=null;delete obj.doneOn;}
    obj.text=text;obj.cat=gv('cat')[0]||'eigen';
  }
  var oldPart=obj.part;
  obj.part=gv('part')[0]||'ochtend';
  var hasT=document.getElementById('fHasTime').checked,tv=fval('fTime');
  if(hasT&&tv)obj.time=tv;else delete obj.time;
  var hasR=document.getElementById('fHasRemind').checked,rv=fval('fRemind');
  if(hasR&&rv)obj.remind=rv;else delete obj.remind;
  if(t&&oldPart!==obj.part){var lg=S.log[today()];if(lg&&lg.moved)delete lg.moved[t.id];}
  obj.min=+(gv('min')[0]||0);
  obj.basic=document.getElementById('fBasic').checked;
  if(!t)S.tasks.push(obj);
  if(sh.inboxId)S.inbox=S.inbox.filter(function(x){return x.id!==sh.inboxId;});
  closeSheet();save();render();
  var where=P(obj.part).label.toLowerCase()+(obj.time?' om '+obj.time:'');
  toast(t?'Opgeslagen':(obj.date&&obj.date!==today()?'Gepland op '+dayLong(obj.date)+', '+where:'In je agenda gezet: '+where));
}
function saveRecipe(){
  var sh=sheet,list=sh.kind==='lunch'?S.lunches:S.recipes,r=sh.id?list.filter(function(x){return x.id===sh.id;})[0]:null;
  var name=fval('rName').trim();
  if(!name){showErr('rErr','Geef het een naam.');document.getElementById('rName').focus();return;}
  var ing=fval('rIng').split(/[\n,;]+/).map(function(s){return s.trim();}).filter(Boolean);
  var obj=r||{id:uid()};
  obj.name=name;obj.ing=ing;
  if(sh.kind!=='lunch')obj.prep=fval('rPrep').trim();
  if(!r)list.push(obj);
  if(sh.kind==='lunch'){
    var ck=document.getElementById('rDefault');
    if(ck&&ck.checked)S.defaultLunch=obj.id;
    else if(ck&&!ck.checked&&S.defaultLunch===obj.id)S.defaultLunch=null;
  }
  closeSheet();save();render();toast(r?'Opgeslagen':'Toegevoegd');
}
function delRecipe(){
  var sh=sheet,isL=sh.kind==='lunch';
  if(!sh.armed){sh.armed=true;renderSheet();return;}
  closeSheet();
  withUndo('Verwijderd',function(){
    if(isL){
      S.lunches=S.lunches.filter(function(x){return x.id!==sh.id;});
      if(S.defaultLunch===sh.id)S.defaultLunch=S.lunches[0]?S.lunches[0].id:null;
      Object.keys(S.menu).forEach(function(k){if(S.menu[k].lunch===sh.id)S.menu[k].lunch=null;});
    }else{
      S.recipes=S.recipes.filter(function(x){return x.id!==sh.id;});
      Object.keys(S.menu).forEach(function(k){if(S.menu[k].dinner===sh.id)S.menu[k].dinner=null;});
    }
  });
}
function saveSettings(){
  var st=S.settings;
  st.sound=document.getElementById('sSound').checked;
  st.hold=gv('hold')[0]||'normaal';
  st.shopDay=+(gv('shopday')[0]||6);

function surprise(){
  var k=sheet.date,near={};
  for(var i=-6;i<=6;i++){var m=S.menu[addDays(k,i)];if(m&&m.dinner)near[m.dinner]=1;}
  var cand=S.recipes.filter(function(r){return !near[r.id];});
  if(!cand.length)cand=S.recipes.filter(function(r){var m=S.menu[k];return !m||m.dinner!==r.id;});
  if(!cand.length){toast('Voeg eerst een paar gerechten toe');return;}
  var pick=cand[Math.floor(Math.random()*cand.length)];
  setMenu(k,'dinner',pick.id);save();render();renderSheet();
}

/* ================= toast ================= */
var toastT=0,toastFn=null,toastEl=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg'),toastBtn=document.getElementById('toastBtn');
function toast(msg,undoFn){
  toastMsg.textContent=msg;toastFn=undoFn||null;toastBtn.hidden=!undoFn;
  toastEl.classList.toggle('plain',!undoFn);toastEl.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on');toastFn=null;},undoFn?6000:2400);
}
toastBtn.addEventListener('click',function(){var f=toastFn;toastFn=null;toastEl.classList.remove('on');if(f)f();});
function withUndo(msg,fn){
  var snap=JSON.stringify(S);
  fn();save();render();
  toast(msg,function(){var n=normalize(JSON.parse(snap));if(n){S=n;save();render();toast('Teruggezet');}});
}
function toggleIn(arr,v){var i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else arr.push(v);}

}
function gsBtns(){if(!GS.el)return;var r=GS.el.querySelector('[data-gs="rain"]'),sd=GS.el.querySelector('[data-gs="snd"]');if(r){r.setAttribute('aria-pressed',String(!!GS.rain));r.classList.toggle('on',!!GS.rain);}if(sd){var on=!S.jar.mute&&S.settings.sound;sd.setAttribute('aria-pressed',String(on));sd.classList.toggle('off',!on);}}
function gsOpen(){gsBuild();GS.rain=!!S.jar.rain;GS.rainT=GS.rain?1:(autoRain()?.5:0);GS.rainA=GS.rainT;gsBtns();ambStart();GS.mmT0=performance.now()/1000+8;GS.open=true;GS.el.hidden=false;document.documentElement.style.overflow='hidden';gsSize();gsUI();GS.last=0;cancelAnimationFrame(GS.raf);GS.raf=requestAnimationFrame(gsLoop);}
function gsClose(){if(!GS.el)return;ambStop();GS.open=false;GS.el.hidden=true;document.documentElement.style.overflow='';cancelAnimationFrame(GS.raf);render();}
function gsLoop(ts){
  if(!GS.open)return;
  var t=ts/1000,dt=GS.last?Math.min(.05,t-GS.last):0;GS.last=t;GS.t=t;
  GS.rainT=GS.rain?1:(autoRain()?.5:0);
  gsDraw(GS.ctx,GS.cv.width,GS.cv.height,GS.scale,GS.ox,GS.oy,t,dt,true);
  if(GS.mmT0!=null&&gsState().mermaid){var lc=t-GS.mmT0,cy=lc>=0?lc%(gsState().pv?44:180):-1,pc=GS.mmPrev;if(pc!=null&&cy>=0){if(pc<10&&cy>=10)splash();if(pc<12.85&&cy>=12.85)splash();if(pc<37.4&&cy>=37.4)splash();}GS.mmPrev=cy;}
  if(t-GS.uiAt>1){GS.uiAt=t;gsUI();}
  GS.raf=requestAnimationFrame(gsLoop);
}
function gsSay(m){GS.msg=m;GS.msgUntil=GS.t+3.2;gsUI(true);}
function gsUI(){
  if(!GS.el)return;
  var st=gsState(),e=eggsToday(),J=S.jar;
  document.getElementById('gsStat').innerHTML='<span>'+FLOWER+blooming()+'/'+J.size+'</span><span>'+EGG+(J.eggs||0)+'</span><button class="gs-bon" data-gs="bons" aria-label="'+(J.bons||0)+' '+esc(J.name)+'-bonnen">'+TAG+(J.bons||0)+'</button>';
  var h;
  if(st.pv)h='Voorbeeld: zo ziet je tuin eruit als hij helemaal vol is.';
  else if(!GS.rain&&GS.rainT>0&&!(GS.msg&&GS.t<GS.msgUntil))h='Er valt een zacht regenbuitje.';
  else if(GS.msg&&GS.t<GS.msgUntil)h=GS.msg;
  else if(st.sick)h='De kippen voelen zich niet zo lekker. Een paar taken vandaag en ze knappen weer op.';
  else if(e.left)h=e.left===1?'Er ligt een ei in het nestje. Tik erop om het te rapen.':'Er liggen '+e.left+' eieren in het nestje. Tik erop om ze te rapen.';
  else if(J.fed!==today())h='De kippen hebben honger. Tik op het voerschaaltje.';
  else if(st.full)h='Je tuin staat in volle bloei. Tijd voor je '+esc(J.name)+'-moment!';
  else if(st.mermaid)h='Er zwemt iemand in het meer…';
  else if(st.fairies)h=st.fairies===1?'Er is een fee in je tuin komen wonen.':'Er wonen nu '+st.fairies+' feeën in je tuin.';
  else if(st.sleepy)h='Je tuin kan wel wat water gebruiken.';
  else h='Elke halve, driekwart en hele dag geeft je tuin water.';
  document.getElementById('gsHint').textContent=h;
  var pct=Math.min(100,J.pts/gCap()*100);
  document.getElementById('gsBottom').innerHTML=(st.full&&!st.pv)?'<button class="btn primary" data-act="jarspend">Pluk je tuin: +1 '+esc(J.name)+'-bon</button>':
    '<div class="gs-prog"><span class="gs-pr"><span>Naar je '+esc(J.name)+'-moment</span>'+(st.pv?'<button class="gs-pv" data-gs="pvoff">Terug naar mijn tuin</button>':'<button class="gs-pv" data-gs="pv">Bekijk een volle tuin</button>')+'</span><span class="gs-bar"><i style="width:'+pct.toFixed(1)+'%"></i></span></div>';
}
function gsTap(e){
  var r=GS.cv.getBoundingClientRect(),x=((e.clientX-r.left)*GS.dpr-GS.ox)/GS.scale,y=((e.clientY-r.top)*GS.dpr-GS.oy)/GS.scale;
  ensureAudio();var J=S.jar,eg=eggsToday();
  for(var i=eg.got;i<eg.laid;i++){var p=EGGPOS[i];if(Math.hypot(x-p[0],y-p[1])<18){
    J.egg={date:today(),got:eg.got+1};J.eggs=(J.eggs||0)+1;save();tick();setTimeout(plink,90);
    for(var h=0;h<4;h++)GS.fx.push({x:p[0],y:p[1]-6,vx:(Math.random()-.5)*30,vy:-20-Math.random()*20,life:1,kind:'sp'});
    gsSay('Ei geraapt! Je hebt nu '+(J.eggs===1?'1 ei':J.eggs+' eieren')+' in je mandje.');return;}}
  if(Math.abs(x-FEEDER.x)<30&&Math.abs(y-FEEDER.y)<22){
    if(J.fed===today()){gsSay('Ze hebben vandaag al gegeten. Dank je!');return;}
    J.fed=today();save();GS.grainsUntil=GS.t+40;tick();GS.chick&&GS.chick.forEach(function(k){k.until=0;});gsSay('Gevoerd! Daar leggen ze vandaag een extra ei van.');return;}
  if(GS.chick)for(var c2=0;c2<GS.chick.length;c2++){var k=GS.chick[c2];if(Math.hypot(x-k.x,y-(k.y-14))<18){GS.fx.push({x:k.x,y:k.y-30,vx:0,vy:-16,life:1,kind:'heart'});cluck();
    gsSay(gsState().sick?'Ze kruipt even tegen je aan.':['Tok tok!','Ze kijkt je nieuwsgierig aan.','Tok! Ze pikt naar je veter.'][c2%3]);return;}}
  var tx2=TREE_X+(x-TREE_X)/TREE_S,ty2=TREE_Y+(y-TREE_Y)/TREE_S;
  if(tx2>-70&&tx2<230&&ty2>150&&ty2<536&&((tx2-74)*(tx2-74))/(150*150)+((ty2-360)*(ty2-360))/(200*200)<1){
    fairyChime();for(var sp=0;sp<16;sp++){var an=Math.random()*Math.PI*2,v=10+Math.random()*30;GS.fx.push({x:x,y:y,vx:Math.cos(an)*v,vy:Math.sin(an)*v-8,life:1.2+Math.random()*.8,kind:'fs'});}
    if(Math.random()<.5)gsSay(['De feeën giechelen zachtjes.','Er dwarrelt feeënstof uit de wilg.','Iets in de boom fluistert je naam.','De zwammenhuisjes knipperen even.'][Math.floor(Math.random()*4)]);
    return;}
  GS.fx.push({x:x,y:y,vx:(Math.random()-.5)*10,vy:-12,life:1,kind:'sp'});
}
function gsThumbs(){
  if(typeof ROCK==='undefined'||!ROCK||!GS){setTimeout(gsThumbs,0);return;}
  var cvs=document.querySelectorAll('canvas[data-gthumb]');
  Array.prototype.forEach.call(cvs,function(cv){
    var dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth||300,h=cv.clientHeight||170;
    cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
    var sc=w/VW*dpr,top=Math.max(300,Math.min(452,VH-8-h/(w/VW))),oy=-top*sc;
    try{gsDraw(cv.getContext('2d'),cv.width,cv.height,sc,0,oy,6.5,0,false);}catch(err){}
  });
}

})();
</script>
